<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Magnifier</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg viewBox="0 0 48 48" width="32" height="32" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="13" stroke="url(#g1)" stroke-width="4"/>
        <line x1="30" y1="30" x2="42" y2="42" stroke="url(#g2)" stroke-width="4" stroke-linecap="round"/>
        <defs>
          <linearGradient id="g1" x1="7" y1="7" x2="33" y2="33" gradientUnits="userSpaceOnUse">
            <stop stop-color="#60a5fa"/>
            <stop offset="1" stop-color="#a78bfa"/>
          </linearGradient>
          <linearGradient id="g2" x1="30" y1="30" x2="42" y2="42" gradientUnits="userSpaceOnUse">
            <stop stop-color="#a78bfa"/>
            <stop offset="1" stop-color="#6d28d9"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <div class="title-block">
      <h1 id="txtAppTitle">Magnifier</h1>
      <span class="subtitle" id="txtSubtitle">Hover to magnify</span>
    </div>
    <div class="toggle-group">
      <label class="toggle" title="Enable / Disable magnifier (Ctrl+M)">
        <input type="checkbox" id="enableToggle" />
        <span class="slider"></span>
      </label>
      <span class="toggle-hotkey" title="Toggle shortcut: Ctrl+M">Ctrl+M</span>
    </div>
  </div>

  <div class="hotkey-banner">
    <span id="txtPressHotkey">Press Ctrl+M to activate / deactivate</span>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label">
      <span id="txtZoomLevel">Zoom Level</span>
      <span class="value-badge" id="zoomBadge">3×</span>
    </div>
    <input type="range" id="zoomSlider" min="1" max="10" step="0.5" value="3" />
    <div class="range-labels">
      <span>1×</span>
      <span>5×</span>
      <span>10×</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label">
      <span id="txtLensSize">Lens Size</span>
      <span class="value-badge" id="sizeBadge">Medium</span>
    </div>
    <input type="range" id="sizeSlider" min="1" max="3" step="1" value="2" />
    <div class="range-labels">
      <span id="txtSizeSmall">Small</span>
      <span id="txtSizeMedium">Medium</span>
      <span id="txtSizeLarge">Large</span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label"><span id="txtLensShape">Lens Shape</span></div>
    <div class="lens-options">
      <label class="lens-option" id="opt-circle">
        <input type="radio" name="lensShape" value="circle" />
        <div class="shape-preview circle-shape"></div>
        <span id="txtCircle">Circle</span>
      </label>
      <label class="lens-option" id="opt-rect">
        <input type="radio" name="lensShape" value="rect" />
        <div class="shape-preview rect-shape"></div>
        <span id="txtRectangle">Rectangle</span>
      </label>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label"><span id="txtLensPos">Lens Position</span></div>
    <div class="pos-grid">
      <span class="pos-empty"></span>
      <label class="pos-option" title="Above cursor">
        <input type="radio" name="lensPos" value="up" />
        <span class="pos-icon">&#8593;</span>
      </label>
      <span class="pos-empty"></span>
      <label class="pos-option" title="Left of cursor">
        <input type="radio" name="lensPos" value="left" />
        <span class="pos-icon">&#8592;</span>
      </label>
      <label class="pos-option" title="Centered on cursor">
        <input type="radio" name="lensPos" value="center" />
        <span class="pos-icon">&#8857;</span>
      </label>
      <label class="pos-option" title="Right of cursor">
        <input type="radio" name="lensPos" value="right" />
        <span class="pos-icon">&#8594;</span>
      </label>
      <span class="pos-empty"></span>
      <label class="pos-option" title="Below cursor">
        <input type="radio" name="lensPos" value="down" />
        <span class="pos-icon">&#8595;</span>
      </label>
      <span class="pos-empty"></span>
    </div>
  </div>

  <div class="divider"></div>

  <div class="section">
    <div class="section-label"><span id="txtLanguage">Language</span></div>
    <select id="langSelect" class="lang-select">
      <!-- Populated dynamically by popup.js from locales.js -->
    </select>
  </div>

  <div class="footer">
    <button id="openPdfViewer" class="pdf-button" type="button">Open PDF Viewer</button>
    <button id="downloadDesktopBtn" class="desktop-button" type="button" title="Directly download Magnifier Desktop App (.zip)">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M0 3.449L9.75 2.1v9.451H0m10.95-9.6L24 0v11.4H10.95M0 12.6h9.75v9.451L0 20.699M10.95 12.6H24V24l-13.05-1.85"/></svg>
      <span id="txtDownloadDesktop">Download for Desktop (.zip)</span>
    </button>
    <span id="txtSavedAuto">Settings are saved automatically</span>
    <div class="company-brand">
      <img src="../icons/yuvatechlogo.png" alt="Yuvatech Solution USA, LLC" class="company-logo" />
      <button id="btnCompanyWebsite" class="company-name-link" type="button" title="Visit yuvatechsolutionsusa.com">Yuvatech Solution USA, LLC</button>
      <button id="btnWhatsNew" class="info-button" type="button" title="View What's New &amp; Release Notes">ⓘ</button>
    </div>
    <div class="contribute-row">
      <span class="contribute-label">Contribute:</span>
      <button id="btnDonatePaypal" class="contribute-icon-btn" type="button" title="Donate via PayPal">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7.076 21.337H2.47a.641.641 0 0 1-.633-.74L4.944.901C5.002.502 5.347.208 5.75.208h7.32c3.42 0 5.86 1.498 5.485 5.093-.306 2.92-2.19 4.887-5.188 4.887H9.79l-1.464 9.387a1.002 1.002 0 0 0-.01.164.737.737 0 0 1-.74.6c-.167 0-.333 0-.5-.002zm1.685-13.68h3.916c2.096 0 3.398-.928 3.593-2.793.187-1.785-.884-2.812-3.14-2.812H8.384L7.387 11.23l1.374-3.573z"/></svg>
      </button>
      <button id="btnDonateBmc" class="contribute-icon-btn contribute-icon-bmc" type="button" title="Buy Me a Coffee">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.216 6.415l-.132-.666c-.119-.597-.387-1.129-.8-1.543-.443-.442-1.025-.69-1.644-.701-.131-.003-.263-.003-.394 0H5.75c-.62 0-1.206.248-1.649.69-.413.414-.681.946-.8 1.543l-.132.666c-.636.195-1.168.61-1.503 1.173-.335.563-.414 1.229-.221 1.88l1.373 4.629c.39 1.316 1.378 2.378 2.684 2.879.626 1.776 2.164 3.037 4.025 3.295v2.244h-2.5a.75.75 0 000 1.5h6.946a.75.75 0 000-1.5h-2.5v-2.244c1.861-.258 3.399-1.519 4.025-3.295 1.306-.501 2.294-1.563 2.684-2.879l1.373-4.629c.193-.651.114-1.317-.221-1.88-.335-.563-.867-.978-1.503-1.173zM18.75 4.996c.264.004.512.11.7.3.176.176.29.404.34.654H18.75v-.954zm-2.035 8.948a3.25 3.25 0 01-3.215 2.556h-3c-1.528 0-2.812-1.066-3.215-2.556L5.94 9.444h11.12l-1.345 4.5zm4.84-4.896l-1.305 4.399c-.19.641-.67 1.159-1.306 1.403l1.107-3.738a.75.75 0 00-.718-.962H18.75V7.496h.635c.294.005.57.122.775.332.185.19.3.436.353.696.027.09.04.183.04.276 0 .092-.013.185-.04.276z"/></svg>
      </button>
    </div>
  </div>

  <script src="../locales.js"></script>
  <script src="popup.js"></script>
</body>
</html>
